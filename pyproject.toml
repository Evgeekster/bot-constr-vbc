[project]
name = "bot-constructor"
version = "0.1.0"
description = "Telegram bot scenario constructor monorepo"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
constructor = [
    "django>=5.1,<6",
    "djangorestframework>=3.15,<4",
    "django-cors-headers>=4.6,<5",
    "django-filter>=24.3,<25",
    "django-cryptography-django5>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "celery[redis]>=5.4,<6",
    "simpleeval>=1.0,<2",
    "cryptography>=44,<45",
    "django-environ>=0.11,<1",
    "httpx>=0.28,<1",
    "gunicorn>=23,<24",
    "whitenoise>=6.8,<7",
]
runner = [
    "aiogram>=3.15,<4",
    "redis>=5.2,<6",
    "simpleeval>=1.0,<2",
    "aiohttp>=3.11,<4",
]
dev = [
    "bot-constructor[constructor,runner]",
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "factory-boy>=3.3,<4",
    "fakeredis[lua]>=2.26,<3",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "django-stubs>=5.1,<6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["back"]
asyncio_mode = "auto"
testpaths = ["back/tests", "runner/tests"]
addopts = "--cov=back/apps --cov=runner/runner --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["back/apps", "runner/runner"]